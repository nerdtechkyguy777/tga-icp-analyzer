[build]
  command = "npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"

# Enable Netlify Blobs for serverless functions (ICP + analysis persistence)
[functions."*"]
  netlify_blobs = ["tga-icp-data"]

# Analysis + ICP API routes can run longer on paid plans
[functions]
  node_bundler = "esbuild"
